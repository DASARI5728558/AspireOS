apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aspireos
  labels: {app: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      imagePullSecrets:       
        - name: utho-registry
      containers:
        - name: backend
          # placeholder tag; CI/CD overwrites this with `kustomize edit set image`
          image: registry.utho.com/asperiondigital/aspireos-backend:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: aspireos-config}
          env:
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: aspireos-secrets, key: SECRET_KEY}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: aspireos-secrets, key: DATABASE_URL}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aspireos
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
