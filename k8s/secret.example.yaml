# DO NOT commit a real version of this file to git.
# This is a template. Generate the real Secret with kubectl (recommended)
# or your CI/CD secret manager instead:
#
#   kubectl create secret generic aspireos-secrets -n aspireos \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="<strong-random-password>" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://aspireos:<same-password>@postgres:5432/aspireos"
#
apiVersion: v1
kind: Secret
metadata:
  name: aspireos-secrets
  namespace: aspireos
type: Opaque
stringData:
  SECRET_KEY: "replace-with-at-least-32-random-characters"
  POSTGRES_PASSWORD: "replace-with-a-strong-random-password"
  DATABASE_URL: "postgresql+psycopg://aspireos:replace-with-a-strong-random-password@postgres:5432/aspireos"
