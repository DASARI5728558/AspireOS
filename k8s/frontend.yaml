apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aspireos
  labels: {app: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          # placeholder tag; CI/CD overwrites this with `kustomize edit set image`
          image: registry.utho.com/yourorg/aspireos-frontend:latest
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aspireos
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
