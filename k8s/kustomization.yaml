apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aspireos

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  
images:
  - name: registry.utho.com/yourorg/aspireos-backend
    newTag: latest
  - name: registry.utho.com/yourorg/aspireos-frontend
    newTag: latest
