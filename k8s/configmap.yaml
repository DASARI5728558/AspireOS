apiVersion: v1
kind: ConfigMap
metadata:
  name: aspireos-config
  namespace: aspireos
data:
  APP_ENV: "production"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: "https://aspireos.example.com"
  ACCESS_TOKEN_MINUTES: "30"
  DIGEST_TIMEZONE: "Asia/Kolkata"
  POSTGRES_DB: "aspireos"
  POSTGRES_USER: "aspireos"
