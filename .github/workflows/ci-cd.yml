name: Build, Push & Deploy AspireOS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; never kill a deploy that is mid-rollout
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.utho.io
  IMAGE_NAMESPACE: asperiondigital
  BACKEND_IMAGE: aspireos-backend
  FRONTEND_IMAGE: aspireos-frontend

jobs:
  # Run backend tests first
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest

  # Build and push Docker images
  build-and-push:
    name: Build & Push Images
    needs: test-backend
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Utho registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.UTHO_REGISTRY_USERNAME }}
          password: ${{ secrets.UTHO_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Kubernetes after images are pushed
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: dev

    env:
      NAMESPACE: aspireos
      IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      # Secret goes through env, not inline ${{ }}, so it never appears in the script text
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d --ignore-garbage > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl get nodes

      # Creates/updates the pull secret from the same GitHub secrets used for docker push.
      # Idempotent, so it is safe on every run and picks up rotated credentials.
      - name: Ensure namespace and registry pull secret
        env:
          REGISTRY_USER: ${{ secrets.UTHO_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.UTHO_REGISTRY_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry utho-registry \
            --docker-server="$REGISTRY" \
            --docker-username="$REGISTRY_USER" \
            --docker-password="$REGISTRY_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

      # NOTE: the image name on the LEFT must match the `image:` field in k8s/*.yaml
      # (ignoring the tag), otherwise kustomize silently changes nothing.
      - name: Update image tags
        working-directory: k8s
        env:
          BACKEND_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}
          FRONTEND_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
        run: |
          kustomize edit set image \
            "$BACKEND_REF=$BACKEND_REF:$IMAGE_TAG" \
            "$FRONTEND_REF=$FRONTEND_REF:$IMAGE_TAG"

      # Fail fast with a clear message instead of a 3-minute rollout timeout
      - name: Verify rendered manifests
        env:
          BACKEND_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}
          FRONTEND_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
        run: |
          RENDERED="$(kustomize build k8s)"
          echo "Images that will be deployed:"
          grep 'image:' <<< "$RENDERED"

          for ref in "$BACKEND_REF:$IMAGE_TAG" "$FRONTEND_REF:$IMAGE_TAG"; do
            if ! grep -q "$ref" <<< "$RENDERED"; then
              echo "::error::Rendered manifests do not contain $ref. Set the image: field in k8s/ to ${ref%:*} (any tag)."
              exit 1
            fi
          done

          if ! grep -q "utho-registry" <<< "$RENDERED"; then
            echo "::error::No imagePullSecrets named utho-registry found in the rendered manifests."
            exit 1
          fi

      - name: Deploy
        run: kubectl apply -k k8s

      - name: Wait for backend
        run: kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=300s

      - name: Wait for frontend
        run: kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n "$NAMESPACE" describe pods | grep -E "^Name:|Warning|Failed|Back-off" || true
          kubectl -n "$NAMESPACE" logs deployment/backend --tail=50 || true
