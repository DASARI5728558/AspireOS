name: Build, Push & Deploy AspireOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.utho.com
  IMAGE_NAMESPACE: aspireos
  BACKEND_IMAGE: aspireos-backend
  FRONTEND_IMAGE: aspireos-frontend

jobs:
  # ---------------------------------------------------------------------
  # 1. Run backend tests on every push and PR
  # ---------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest
        working-directory: backend

  # ---------------------------------------------------------------------
  # 2. Build & push Docker images (skipped for pull requests)
  # ---------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    needs: test-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: vars
        run: echo "tag=$(echo ${GITHUB_SHA} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 3a. Deploy to Kubernetes (main branch only)
  # ---------------------------------------------------------------------
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Point image tags at this build
        working-directory: k8s
        run: |
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.tag }}

      - name: Apply manifests
        run: kubectl apply -k k8s

      - name: Wait for rollout
        run: |
          kubectl -n aspireos rollout status deployment/backend --timeout=180s
          kubectl -n aspireos rollout status deployment/frontend --timeout=180s

  # ---------------------------------------------------------------------
  # 3b. Deploy via SSH (main branch only)
  # ---------------------------------------------------------------------
  deploy-ssh:
    name: Deploy via SSH
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/utho_key
          chmod 600 ~/.ssh/utho_key
          ssh-keyscan -H "${{ secrets.UTHO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Utho
        run: |
          ssh -i ~/.ssh/utho_key \
            ${{ secrets.UTHO_USER }}@${{ secrets.UTHO_HOST }} \
            'cd /var/www/myapp && git pull origin main && npm install && npm run build && pm2 restart myapp'
